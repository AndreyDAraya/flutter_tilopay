name: tilopay
description: >-
  SDK oficial de Tilopay para Flutter. Integra el gateway de pagos Tilopay
  con soporte para flujo redirect, pago nativo FAC, 3DS, suscripciones,
  tokenización de tarjetas y verificación HMAC-SHA256 de webhooks.
version: 1.0.0
homepage: https://tilopay.com
repository: https://github.com/tilopay/tilopay-flutter
issue_tracker: https://github.com/tilopay/tilopay-flutter/issues

topics:
  - payments
  - gateway
  - tilopay
  - ecommerce
  - fintech

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  crypto: ^3.0.7
  dio: ^5.9.2
  flutter:
    sdk: flutter
  webview_flutter: ^4.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

